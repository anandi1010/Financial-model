    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Chart Container Styling - MANDATORY Requirements */
        .chart-container {
            position: relative;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            height: 350px; /* Base height */
            max-height: 400px;
        }
        
        @media (min-width: 1024px) {
            .chart-container {
                height: 400px;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Transitions */
        .nav-item { transition: all 0.2s ease-in-out; }
        .nav-item:hover { background-color: #e2e8f0; transform: translateX(4px); }
        .nav-item.active { background-color: #3b82f6; color: white; border-right: 4px solid #1e3a8a; }
        .nav-item.active:hover { background-color: #2563eb; transform: none; }
        
        /* Animation */
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
